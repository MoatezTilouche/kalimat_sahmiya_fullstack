name: kalimat_sahmiya
description: لعبة كلمات سهمية عربية مع مستويات وتقدم محفوظ محليا.
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/starter_levels.json
    - assets/knowledge/cards.json
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
